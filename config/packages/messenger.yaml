framework:
  messenger:
    failure_transport: failed

    transports:
      async:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          table_name: messenger_messages
      failed: 'doctrine://default?queue_name=failed'
      sync: 'sync://'

    routing:
      'App\Module\Core\Application\Bus\SyncCommandInterface': sync
      'App\Module\Core\Application\Bus\QueryInterface': sync

when@test:
  framework:
    messenger:
      transports:
        sync:
          dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
